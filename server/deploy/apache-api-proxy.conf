# Add this block to the :443 VirtualHost of BOTH vhosts, right after the
# DocumentRoot line so /api/* is matched before the SPA FallbackResource:
#   /etc/apache2/sites-available/clowderandcrest.com-le-ssl.conf
#   /etc/apache2/sites-available/clowder.stephens.page-le-ssl.conf
#
# Requires: a2enmod proxy proxy_http
# The clowder-sync routes are already /api/-prefixed, so the proxy target keeps
# the prefix. After editing: apachectl configtest && systemctl reload apache2.

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3486/api/
    ProxyPassReverse /api/ http://127.0.0.1:3486/api/
